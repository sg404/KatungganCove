<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katunggan Cove Resort</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"></head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">
        <img src="images\katunggan.svg" alt="Logo">
        <div>
          <h2>Katunggan Cove Resort</h2>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Accommodation</a></li>
          <li><a href="#">Facilities</a></li>
          <li><a href="#">Gallery</a></li>
          <li><a href="#">Café</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>


      <div class="menu-btn">&#9776;</div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">

    <div class="slides">
      <img src="images\image1.webp" class="slide active">
      <img src="images\image2.webp" class="slide">
      <img src="images\image3.webp" class="slide">
      <img src="images\image4.webp" class="slide">
      <img src="images\image5.webp" class="slide">
    </div>

    <div class="overlay"></div>

    <div class="hero-content">
      <p>WELCOME TO PARADISE</p>
      <h1>Experience Luxury by the Sea</h1>
      <span>
        Discover beautiful accommodations, breathtaking sunsets,
        and unforgettable memories.
      </span>

      
    </div>

    <div class="dots">
      <span class="dot active-dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
